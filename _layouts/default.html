<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="header"><div class="wrap nav">
  <a class="brand" href="{{ '/' | relative_url }}">Martin Kropp<span class="brand-dot">.</span></a>
  <nav aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/about' | relative_url }}">About</a>
    <a href="{{ '/research1' | relative_url }}">Research</a>
    <a href="{{ '/publications1' | relative_url }}">Publications</a>
    <a href="{{ '/teaching' | relative_url }}">Teaching</a>
    <a href="{{ '/professional-activities1' | relative_url }}">Activities</a>
  </nav>
</div></header>
<main id="content" class="wrap main">
{% if page.url != '/' %}<div class="eyebrow">ACADEMIC PROFILE</div><h1>{{ page.title }}</h1>{% endif %}
<article class="prose">{{ content }}</article>
</main>
<footer class="footer"><div class="wrap"><span>© {{ 'now' | date: '%Y' }} Martin Kropp</span><span>Academic homepage · <a href="https://www.kropp.ch">Original website</a></span></div></footer>
</body></html>
